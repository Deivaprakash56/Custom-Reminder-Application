<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Reminders Evolved</title>
  <meta name="description" content="A 2-minute narrated tour of how the Reminders app grew from a simple task list into a personal assistant, from the ideas of Deivaprakash.">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <style>
    :root { --bg: #0a0c12; --text: #eef0f7; --muted: #9aa0b6; --accent: #8b84ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 10% 0%, #2b2470, transparent 60%), var(--bg); color: var(--text);
      font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
    main { width: min(1100px, 100%); }
    h1 { font-size: clamp(26px, 4vw, 40px); margin: 0 0 6px; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 20px; }
    video { width: 100%; border-radius: 16px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; color: #fff; background: #4f46e5; }
    a.btn.ghost { background: transparent; border: 1px solid #2c3142; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>How Reminders evolved</h1>
    <p>From a simple task list to a personal assistant, built step by step from the ideas of Deivaprakash. 2:13, narrated (captions available).</p>
    <video controls preload="metadata" playsinline poster="media/evolution-poster.jpg">
      <source src="media/reminders-evolution.mp4" type="video/mp4">
      <track kind="captions" src="media/reminders-evolution.vtt" srclang="en" label="English" default>
      Your browser can't play this video. <a href="media/reminders-evolution.mp4">Download it</a>.
    </video>
    <div class="row">
      <a class="btn" href="./">Open the app</a>
      <a class="btn ghost" href="https://github.com/Deivaprakash56/Custom-Reminder-Application">View the code</a>
      <a class="btn ghost" href="media/reminders-evolution.mp4" download>Download MP4</a>
    </div>
  </main>
</body>
</html>
