<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nudge</title>
  <meta name="description" content="Nudge: reminders, to-dos, a task board and notes with a voice assistant. Works offline; your data stays on this device.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nudge">
  <script src="config.js"></script>
  <script>
    // Accounts: when a server is configured, Nudge needs a signed-in session.
    (function () {
      var api = String((window.NUDGE_CONFIG || {}).api || "").trim(); var s = null;
      try { s = JSON.parse(localStorage.getItem("nudge.session")); } catch (e) { /* none */ }
      if (api && !(s && s.token && s.user)) { window.NUDGE_REDIRECTING = true; location.replace("login.html" + location.search); }
      window.NUDGE_SESSION = api && s && s.token && s.user ? s : null;
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ============================================================ sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <div class="side-head">
        <div class="brand">
          <img src="icons/icon-192.png" alt="" class="brand-logo">
          <div>
            <div class="brand-name">Nudge</div>
            <div class="brand-sub">Plan · Remember · Do</div>
          </div>
        </div>
        <button class="icon-btn only-mobile" id="sideClose" aria-label="Close menu" data-icon="x"></button>
      </div>

      <section class="clock-card" aria-label="Current time">
        <div class="clock-time" aria-live="off">
          <span id="clkHM">--:--</span><span id="clkS" class="clock-sec">:--</span><span id="clkAP" class="clock-ap">--</span>
        </div>
        <div id="clkDate" class="clock-date"></div>
        <div id="clkNext" class="clock-next"></div>
      </section>

      <label class="side-search">
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search everything" aria-label="Search everything" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>

      <nav id="nav" class="nav"></nav>

      <div class="side-foot">
        <button class="side-link" id="settingsBtn"><span data-icon="settings"></span>Settings</button>
        <button class="side-link" id="installBtn" hidden><span data-icon="download"></span>Install app</button>
        <div class="account-chip" id="accountChip" hidden>
          <div class="avatar" id="accountAvatar" aria-hidden="true"></div>
          <div class="account-who"><strong id="accountName"></strong><span id="accountEmail"></span></div>
          <button class="btn ghost sm" id="signOutBtn" title="Sign out of Nudge"><span data-icon="logout" data-size="14"></span>Sign out</button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- ============================================================ main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu" data-icon="menu"></button>
        <div class="view-head">
          <div id="viewIcon" class="view-icon"></div>
          <div>
            <h1 id="viewTitle">Today</h1>
            <p id="viewSub" class="muted"></p>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn ghost hide-sm" id="notifyBtn" hidden><span data-icon="bell"></span>Enable notifications</button>
          <button class="btn primary" id="newBtn"><span data-icon="plus"></span><span class="hide-sm">New reminder</span></button>
          <button class="mic-btn" id="micBtn" aria-label="Voice assistant" title="Voice assistant (Ctrl+K)"><span class="mic-orb"></span><span data-icon="mic"></span></button>
        </div>
      </header>
      <div id="mClock" class="m-clock" aria-hidden="true"></div>
      <div id="installBar" class="install-bar" hidden>
        <img src="icons/icon-192.png" alt="">
        <div class="install-text"><strong>Install Nudge</strong><span>Add it to your home screen for alerts and offline use.</span></div>
        <button class="btn primary sm" id="installBarBtn">Install</button>
        <button class="icon-btn sm" id="installBarClose" aria-label="Not now" data-icon="x"></button>
      </div>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <!-- ============================================================ voice assistant -->
  <div id="assistant" class="assistant" hidden role="dialog" aria-modal="true" aria-label="Voice assistant">
    <div class="as-glow" aria-hidden="true"></div>
    <div class="as-panel">
      <div class="as-top">
        <div class="as-title"><span data-icon="sparkles"></span>Assistant</div>
        <div class="as-top-actions">
          <button class="icon-btn" id="asSpeak" title="Spoken replies" aria-label="Toggle spoken replies" data-icon="volume"></button>
          <button class="icon-btn" id="asClose" aria-label="Close assistant" data-icon="x"></button>
        </div>
      </div>
      <div id="asLog" class="as-log" aria-live="polite"></div>
      <div id="asLive" class="as-live"></div>
      <div class="as-center">
        <button id="asOrb" class="orb" aria-label="Tap to speak"><span class="orb-core"></span></button>
        <div id="asHint" class="as-hint">Tap the orb and speak</div>
      </div>
      <div id="asChips" class="as-chips"></div>
      <form id="asForm" class="as-form" autocomplete="off">
        <input id="asInput" placeholder="Or type: “Remind me to call mom tomorrow at 6 pm”" aria-label="Type a command">
        <button class="btn primary" aria-label="Send" data-icon="send"></button>
      </form>
    </div>
  </div>

  <div id="alerts" class="alerts" aria-live="assertive"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- ============================================================ reminder editor -->
  <dialog id="editDialog" class="sheet">
    <form id="editForm" method="dialog">
      <div class="sheet-head">
        <h2 id="editTitle">New reminder</h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Close" data-icon="x"></button>
      </div>
      <input name="title" class="big-input" placeholder="Title" required maxlength="200" aria-label="Title">
      <textarea name="notes" rows="2" placeholder="Notes" maxlength="4000" aria-label="Notes"></textarea>
      <div class="form-grid">
        <label>Date <input type="date" name="date"></label>
        <label>Time <input type="time" name="time"></label>
        <label>Remind me
          <select name="remind_before">
            <option value="0">At time of event</option>
            <option value="5">5 minutes before</option>
            <option value="10">10 minutes before</option>
            <option value="15">15 minutes before</option>
            <option value="30">30 minutes before</option>
            <option value="60">1 hour before</option>
            <option value="120">2 hours before</option>
            <option value="1440">1 day before</option>
          </select>
        </label>
        <label>Repeat
          <select name="repeat">
            <option value="none">Never</option>
            <option value="daily">Every day</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="yearly">Every year</option>
          </select>
        </label>
        <label>Priority
          <select name="priority">
            <option value="normal">None</option>
            <option value="low">Low</option>
            <option value="high">High (flagged)</option>
          </select>
        </label>
        <label>Folder <select name="folder" id="editFolder"></select></label>
      </div>
      <div class="quick-dates" id="quickDates">
        <button type="button" data-q="30m">In 30 min</button>
        <button type="button" data-q="1h">In 1 hour</button>
        <button type="button" data-q="tonight">Tonight</button>
        <button type="button" data-q="tomorrow">Tomorrow 9 AM</button>
        <button type="button" data-q="weekend">Weekend</button>
        <button type="button" data-q="clear">No date</button>
      </div>
      <div class="form-grid">
        <label>Location <select name="geo" id="editGeo"></select></label>
        <label class="check-row"><input type="checkbox" name="nag"><span>Keep reminding me every 5 minutes until it's done</span></label>
      </div>
      <div class="editor-block">
        <div class="block-head">Checklist <span id="subCount" class="muted small"></span></div>
        <div id="subList" class="sub-list"></div>
        <input id="subAdd" class="sub-add" placeholder="+ Add a step and press Enter" maxlength="200" aria-label="Add a step">
      </div>
      <div class="editor-block">
        <div class="block-head">Attachments
          <button type="button" class="btn ghost sm" id="attachBtn"><span data-icon="upload" data-size="14"></span>Add photo or file</button>
        </div>
        <div id="attachList" class="attach-list"></div>
        <input type="file" id="attachInput" multiple hidden>
      </div>
      <div class="cal-links">
        <button type="button" class="btn ghost sm" id="icsBtn"><span data-icon="scheduled" data-size="14"></span>Add to calendar (.ics)</button>
        <a class="btn ghost sm" id="gcalBtn" target="_blank" rel="noopener" href="#">Google Calendar</a>
      </div>
      <p id="editError" class="error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger-ghost" id="editDelete" hidden><span data-icon="trash"></span>Delete</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- ============================================================ private vault -->
  <dialog id="vaultDialog" class="sheet narrow">
    <form id="vaultForm" method="dialog" autocomplete="off">
      <div class="vault-lock" data-icon="lock" data-size="34"></div>
      <h2 id="vaultTitle">Private folder</h2>
      <p id="vaultText" class="muted"></p>
      <input type="text" name="username" autocomplete="username" value="reminders-private" hidden>
      <input type="password" name="current" placeholder="Current password" autocomplete="current-password" aria-label="Current password">
      <input type="password" name="pw" placeholder="Password" autocomplete="new-password" aria-label="Password">
      <input type="password" name="pw2" placeholder="Confirm password" autocomplete="new-password" aria-label="Confirm password">
      <button type="button" class="btn ghost bio-btn" id="vaultBio" hidden><span data-icon="user" data-size="16"></span>Unlock with fingerprint / face</button>
      <p id="vaultError" class="error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger-ghost" id="vaultReset" hidden>Forgot password?</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok" id="vaultOk">Unlock</button>
      </div>
    </form>
  </dialog>

  <!-- ============================================================ folder -->
  <dialog id="folderDialog" class="sheet narrow">
    <form id="folderForm" method="dialog" autocomplete="off">
      <div class="sheet-head">
        <h2 id="folderTitle">New folder</h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Close" data-icon="x"></button>
      </div>
      <input name="name" class="big-input" placeholder="Folder name" required maxlength="40" aria-label="Folder name">
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour"></div>
      <p id="folderError" class="error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger-ghost" id="folderDelete" hidden><span data-icon="trash"></span>Delete folder</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- ============================================================ settings -->
  <dialog id="settingsDialog" class="sheet">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button class="icon-btn" id="settingsClose" aria-label="Close" data-icon="x"></button>
    </div>
    <div id="settingsBody" class="settings"></div>
  </dialog>

  <!-- ============================================================ install help -->
  <dialog id="installDialog" class="sheet narrow">
    <div class="sheet-head">
      <h2>Install Nudge</h2>
      <button class="icon-btn" id="installClose" aria-label="Close" data-icon="x"></button>
    </div>
    <div id="installSteps" class="install-steps"></div>
  </dialog>

  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <div id="focusWidget" class="focus-widget" hidden></div>
  <script src="nlp.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
</body>
</html>
